<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Model Viewer</title>
<style>
  :root{--bg1:#e9edf2;--bg2:#b9c3d0;--ink:#1d2733;--panel:rgba(255,255,255,.9);--accent:#1f6feb}
  @media (prefers-color-scheme:dark){:root{--bg1:#2a3340;--bg2:#12171e;--ink:#e8edf3;--panel:rgba(28,34,42,.9);--accent:#6ea8ff}}
  html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,"Noto Sans Thai",sans-serif;color:var(--ink);
    background:linear-gradient(180deg,var(--bg1),var(--bg2))}
  canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
  .bar{position:fixed;left:12px;top:10px;display:flex;flex-direction:column;gap:4px;padding:5px;
    background:var(--panel);border-radius:12px;backdrop-filter:blur(8px);box-shadow:0 2px 12px rgba(0,0,0,.18)}
  .tool{position:relative;width:38px;height:38px;border:0;background:transparent;color:inherit;border-radius:8px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;padding:0}
  .tool svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .tool:hover,.tool[aria-pressed=true]{background:rgba(127,127,127,.22)}
  .tool[aria-pressed=true]{color:var(--accent)}
  .tool:focus-visible{outline:2px solid var(--accent)}
  .tool::after{content:attr(data-tip);position:absolute;left:calc(100% + 12px);top:50%;transform:translateY(-50%);white-space:nowrap;
    font-size:13px;padding:6px 10px;border-radius:7px;background:var(--ink);color:var(--bg1);opacity:0;pointer-events:none;transition:opacity .12s;z-index:5}
  .tool:hover::after,.tool:focus-visible::after{opacity:1}
  #pick{position:fixed;top:10px;right:12px;max-width:min(56vw,340px);min-width:180px;font:inherit;font-size:14px;color:var(--ink);
    background:var(--panel);border:0;border-radius:10px;padding:9px 12px;backdrop-filter:blur(8px);box-shadow:0 2px 12px rgba(0,0,0,.18);cursor:pointer}
  #pick:focus-visible{outline:2px solid var(--accent)}
  #pick:disabled{cursor:default;opacity:.75}
  #info{position:fixed;right:12px;top:58px;width:min(340px,calc(100vw - 24px));max-height:calc(100vh - 205px);overflow:auto;
    background:var(--panel);backdrop-filter:blur(8px);border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.18);font-size:13px;line-height:1.45}
  #info[hidden]{display:none}
  #info header{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;padding:12px 8px 8px 12px;position:sticky;top:0;background:var(--panel)}
  #info-title{font-weight:600;font-size:14px;word-break:break-word}
  #info-badge{display:inline-block;margin-top:4px;padding:1px 9px;border-radius:99px;background:rgba(31,111,235,.16);color:var(--accent);font-size:12px}
  #info-close{border:0;background:transparent;color:inherit;font-size:20px;line-height:1;cursor:pointer;border-radius:6px;padding:2px 8px}
  #info-close:hover{background:rgba(127,127,127,.22)}
  .rows{display:grid;grid-template-columns:minmax(76px,36%) 1fr;gap:3px 10px;margin:0;padding:0 12px 10px}
  .rows dt{opacity:.65}
  .rows dd{margin:0;word-break:break-word}
  #info details{border-top:1px solid rgba(127,127,127,.25)}
  #info summary{cursor:pointer;padding:8px 12px;font-weight:600}
  #info details .rows{padding-top:2px}
  #tag{position:fixed;left:0;top:0;z-index:6;pointer-events:none;display:none;min-width:150px;max-width:260px;padding:8px 11px;border-radius:10px;
    background:var(--panel);backdrop-filter:blur(8px);box-shadow:0 2px 14px rgba(0,0,0,.28);border:1px solid var(--accent);font-size:12.5px;line-height:1.45}
  #tag::after{content:"";position:absolute;left:50%;bottom:-7px;width:12px;height:12px;background:var(--panel);border:solid var(--accent);border-width:0 1px 1px 0;transform:translateX(-50%) rotate(45deg)}
  #tag b{display:block;font-size:13px;margin-bottom:3px;word-break:break-word}
  #tag .z{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}
  #tag .z span:first-child{opacity:.7}
  #tag .z span:last-child{font-weight:600;color:var(--accent)}
  #tag .d{margin-top:3px;padding-top:3px;border-top:1px solid rgba(127,127,127,.3);opacity:.85;word-break:break-word}
  #hid{position:fixed;left:64px;top:10px;z-index:6;width:min(280px,calc(100vw - 80px));max-height:60vh;overflow:auto;padding:6px;border-radius:12px;
    background:var(--panel);backdrop-filter:blur(8px);box-shadow:0 2px 12px rgba(0,0,0,.18);font-size:13px}
  #hid[hidden]{display:none}
  #hid h4{margin:4px 6px 6px;font-size:13px}
  #hid button{display:flex;width:100%;gap:8px;align-items:center;justify-content:space-between;border:0;background:transparent;color:inherit;font:inherit;text-align:left;
    padding:6px 8px;border-radius:7px;cursor:pointer}
  #hid button:hover{background:rgba(127,127,127,.22)}
  #hid button span:first-child{word-break:break-word}
  #hid button span:last-child{color:var(--accent);white-space:nowrap}
  #hid p{margin:6px;opacity:.65}
  .tool .cnt{position:absolute;right:1px;top:1px;min-width:15px;height:15px;border-radius:8px;background:var(--accent);color:#fff;font-size:10px;line-height:15px;text-align:center;display:none;padding:0 3px}
  #gizmo{position:fixed;right:12px;bottom:12px;width:120px;height:120px;z-index:4;border-radius:14px;cursor:pointer;touch-action:none;
    background:var(--panel);backdrop-filter:blur(8px);box-shadow:0 2px 12px rgba(0,0,0,.18)}
  body.ui0 #gizmo{display:none}
  #hint{position:fixed;left:12px;bottom:10px;font-size:12px;opacity:.7;pointer-events:none}
  #msg{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;pointer-events:none}
  #msg b{font-size:20px} #msg span{opacity:.7;font-size:14px;max-width:420px;line-height:1.5}
  #drop{position:fixed;inset:12px;border:2px dashed var(--accent);border-radius:16px;display:none;align-items:center;justify-content:center;font-size:18px;background:rgba(31,111,235,.08)}
  body.dragging #drop{display:flex}
  #bar-progress{position:fixed;top:0;left:0;height:3px;width:0;background:var(--accent);transition:width .15s;z-index:9}
  body.ui0 .bar,body.ui0 #pick,body.ui0 #hint{display:none}
  @media (max-width:600px){
    #info{top:auto;bottom:12px;left:12px;right:12px;width:auto;max-height:45vh}
    #gizmo{bottom:auto;top:56px;width:96px;height:96px}
    #hint{display:none}
  }
</style>
</head>
<body>
<div id="bar-progress"></div>
<select id="pick" aria-label="เลือกโครงการ"><option>กำลังโหลดรายการ…</option></select>
<div class="bar" id="bar">
  <button class="tool" id="b-home" data-tip="รีเซ็ตมุมมอง" aria-label="รีเซ็ตมุมมอง"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/><circle cx="12" cy="12" r="2.5"/></svg></button>
  <button class="tool" id="b-ortho" data-tip="มุมมองแบบ Orthographic (ไม่มีมุมมองลึก)" aria-label="Orthographic" aria-pressed="false"><svg viewBox="0 0 24 24"><rect x="4" y="8" width="12" height="12"/><path d="M4 8l4-4h12v12l-4 4M16 8l4-4"/></svg></button>
  <button class="tool" id="b-axis" data-tip="สลับแกน Z/Y (ถ้าโมเดลนอนตะแคง)" aria-label="สลับแกน Z/Y" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7M21 4v5h-5"/></svg></button>
  <button class="tool" id="b-sec" data-tip="Section Box: ครอบโมเดล ลากจุดเพื่อรูดเข้า/ออก" aria-label="Section Box" aria-pressed="false"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1.5" stroke-dasharray="3 2.4"/><path d="M12 8v8M9.5 10.5L12 8l2.5 2.5M9.5 13.5L12 16l2.5-2.5"/></svg></button>
  <button class="tool" id="b-wire" data-tip="โหมดเส้นลวด (Wireframe)" aria-label="Wireframe" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9zM12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg></button>
  <button class="tool" id="b-hide" data-tip="ซ่อนชิ้นงานที่เลือก (H)" aria-label="Hide"><svg viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 6.1A9.7 9.7 0 0 1 12 6c5 0 8.5 4.2 9.5 6a14 14 0 0 1-2.9 3.5M6.5 7.6A14 14 0 0 0 2.5 12C3.5 13.8 7 18 12 18c1.5 0 2.8-.4 4-1M9.9 9.900a3 3 0 0 0 4.2 4.2"/></svg></button>
  <button class="tool" id="b-unhide" data-tip="Unhide: เลือกชิ้นงานที่ซ่อนไว้เพื่อแสดงกลับ" aria-label="Unhide" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M2.5 12C3.5 10.2 7 6 12 6s8.5 4.2 9.5 6c-1 1.8-4.5 6-9.5 6s-8.5-4.2-9.5-6z"/><circle cx="12" cy="12" r="3"/></svg><i class="cnt" id="hid-cnt"></i></button>
  <button class="tool" id="b-unhall" data-tip="Unhide All: แสดงทุกชิ้นงานที่ซ่อน (Shift+H)" aria-label="Unhide All"><svg viewBox="0 0 24 24"><path d="M1.5 12C2.5 10.2 6 6 11 6s8.5 4.2 9.5 6c-1 1.8-4.5 6-9.5 6s-8.5-4.2-9.5-6z"/><circle cx="11" cy="12" r="2.5"/><path d="M19 16v6M16 19h6" /></svg></button>
  <button class="tool" id="b-tag" data-tip="แสดง/ซ่อน Tag (ชื่อ · ระดับ TOP/BOTTOM · Description)" aria-label="Tag" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M3 12.5V4h8.5L20 12.5 12.5 20z"/><circle cx="8" cy="8.5" r="1.3"/></svg></button>
  <button class="tool" id="b-link" data-tip="คัดลอกลิงก์แชร์" aria-label="คัดลอกลิงก์แชร์"><svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg></button>
</div>
<aside id="info" hidden>
  <header><div><div id="info-title"></div><span id="info-badge"></span></div><button id="info-close" aria-label="ปิด">×</button></header>
  <div id="info-body"></div>
</aside>
<canvas id="gizmo" title="แกนของโมเดล · คลิกปลายแกนเพื่อมองตามแกนนั้น (Z = Top view)"></canvas>
<div id="tag"></div>
<div id="hid" hidden></div>
<div id="hint"></div>
<div id="msg"><b>เลือกโครงการจากเมนูมุมขวาบน</b><span>โมเดลอ่านจากโฟลเดอร์ models ใน GitHub (รองรับ .ifc .fbx .obj .glb)</span></div>
<div id="drop">วางไฟล์เพื่อดูตัวอย่าง</div>

<script type="importmap">
{"imports":{
 "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
 "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {DRACOLoader} from 'three/addons/loaders/DRACOLoader.js';
import {MeshoptDecoder} from 'three/addons/libs/meshopt_decoder.module.js';
import {FBXLoader} from 'three/addons/loaders/FBXLoader.js';
import {OBJLoader} from 'three/addons/loaders/OBJLoader.js';
import {MTLLoader} from 'three/addons/loaders/MTLLoader.js';

const WEBIFC_BASE = 'https://cdn.jsdelivr.net/npm/web-ifc@0.0.57/';

// ==IFC-START==
// อ่านไฟล์ IFC -> THREE.Group (รวมเมชตามสี) + ตารางหา expressID จากสามเหลี่ยม
async function parseIfc(THREE, api, WebIFC, data) {
  const modelID = api.OpenModel(data, { COORDINATE_TO_ORIGIN: false });
  if (modelID < 0) throw new Error('open failed');
  const groups = new Map(); // colorKey -> {color, opacity, pos:[], nor:[], idx:[], ids:[], vcount, ranges}
  const ranges = new Map(); // expressID -> [{key,start,count}]
  let OX = null, OY = 0; // ย้ายจุดกำเนิดเฉพาะแกน X/Y (คงค่า Z จริงไว้ เพื่ออ่านค่าระดับ)
  api.StreamAllMeshes(modelID, (mesh) => {
    const pid = mesh.expressID;
    const n = mesh.geometries.size();
    for (let i = 0; i < n; i++) {
      const pg = mesh.geometries.get(i);
      const c = pg.color;
      const key = [c.x, c.y, c.z, c.w].map(v => v.toFixed(3)).join(',');
      let g = groups.get(key);
      if (!g) { g = { c, pos: [], nor: [], idx: [], ids: [], vcount: 0 }; groups.set(key, g); }
      const geom = api.GetGeometry(modelID, pg.geometryExpressID);
      const verts = api.GetVertexArray(geom.GetVertexData(), geom.GetVertexDataSize());
      const index = api.GetIndexArray(geom.GetIndexData(), geom.GetIndexDataSize());
      const m = pg.flatTransformation;
      const vc = verts.length / 6;
      const P = new Float32Array(vc * 3), N = new Float32Array(vc * 3), I = new Float32Array(vc).fill(pid);
      for (let v = 0; v < vc; v++) {
        const x = verts[v*6], y = verts[v*6+1], z = verts[v*6+2];
        const nx = verts[v*6+3], ny = verts[v*6+4], nz = verts[v*6+5];
        const wx = m[0]*x + m[4]*y + m[8]*z  + m[12], wy = m[1]*x + m[5]*y + m[9]*z  + m[13];
        if (OX === null) { OX = wx; OY = wy; }
        P[v*3]   = wx - OX;
        P[v*3+1] = wy - OY;
        P[v*3+2] = m[2]*x + m[6]*y + m[10]*z + m[14];
        N[v*3]   = m[0]*nx + m[4]*ny + m[8]*nz;
        N[v*3+1] = m[1]*nx + m[5]*ny + m[9]*nz;
        N[v*3+2] = m[2]*nx + m[6]*ny + m[10]*nz;
      }
      const start = g.idx.reduce((s, a) => s + a.length, 0);
      const I2 = new Uint32Array(index.length);
      for (let k = 0; k < index.length; k++) I2[k] = index[k] + g.vcount;
      g.pos.push(P); g.nor.push(N); g.ids.push(I); g.idx.push(I2); g.vcount += vc;
      let r = ranges.get(pid); if (!r) ranges.set(pid, r = []);
      const last = r[r.length - 1];
      if (last && last.key === key && last.start + last.count === start) last.count += index.length;
      else r.push({ key, start, count: index.length });
      geom.delete();
    }
  });
  const cat = (arrs, T) => { let L = 0; for (const a of arrs) L += a.length; const o = new T(L); let p = 0; for (const a of arrs) { o.set(a, p); p += a.length; } return o; };
  const root = new THREE.Group();
  const meshes = new Map();
  for (const [key, g] of groups) {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(cat(g.pos, Float32Array), 3));
    geo.setAttribute('normal', new THREE.BufferAttribute(cat(g.nor, Float32Array), 3));
    geo.setAttribute('expressId', new THREE.BufferAttribute(cat(g.ids, Float32Array), 1));
    geo.setIndex(new THREE.BufferAttribute(cat(g.idx, Uint32Array), 1));
    const mat = new THREE.MeshStandardMaterial({
      color: new THREE.Color(g.c.x, g.c.y, g.c.z), roughness: .85, metalness: 0,
      opacity: g.c.w, transparent: g.c.w < 0.99, depthWrite: g.c.w >= 0.99, side: THREE.DoubleSide
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.userData.ifcMesh = true;
    root.add(mesh); meshes.set(key, mesh);
  }
  return { root, modelID, ranges, meshes, origin: [OX || 0, OY || 0] };
}

// ค่าระดับจริง (เมตร) TOP/BOTTOM ของชิ้นส่วน จากพิกัด Z ของเมชใน IFC
const origIdx = (ifc, mesh) => {
  if (!ifc.orig) ifc.orig = new Map();
  if (!ifc.orig.has(mesh)) ifc.orig.set(mesh, mesh.geometry.index.array);
  return ifc.orig.get(mesh);
};
function ifcBounds(ifc, id) {
  let zmin = Infinity, zmax = -Infinity, xmin = Infinity, xmax = -Infinity, ymin = Infinity, ymax = -Infinity;
  for (const r of ifc.ranges.get(id) || []) {
    const mesh = ifc.meshes.get(r.key), geo = mesh.geometry, idx = origIdx(ifc, mesh), pos = geo.attributes.position.array;
    for (let k = r.start; k < r.start + r.count; k++) {
      const v = idx[k] * 3, x = pos[v], y = pos[v+1], z = pos[v+2];
      if (z < zmin) zmin = z; if (z > zmax) zmax = z;
      if (x < xmin) xmin = x; if (x > xmax) xmax = x;
      if (y < ymin) ymin = y; if (y > ymax) ymax = y;
    }
  }
  return zmin === Infinity ? null : { top: zmax, bot: zmin, cx: (xmin + xmax) / 2, cy: (ymin + ymax) / 2 };
}
const fmtZ = v => (v >= 0 ? '+' : '') + v.toFixed(3);

// ข้อมูลชิ้นส่วน: ชนิด ชื่อ ชั้น Property Sets
function ifcVal(x) {
  if (x === null || x === undefined) return '';
  if (typeof x === 'object' && 'value' in x) return ifcVal(x.value);
  if (typeof x === 'boolean') return x ? 'ใช่' : 'ไม่ใช่';
  if (typeof x === 'number') return Number.isInteger(x) ? String(x) : String(Math.round(x * 10000) / 10000);
  return String(x);
}
function toArr(x) { return x == null ? [] : Array.isArray(x) ? x : [x]; }
function refId(x) { return x && typeof x === 'object' && 'value' in x ? x.value : x; }

function buildIfcIndex(api, WebIFC, modelID) {
  const idx = { psets: new Map(), type: new Map(), storey: new Map() };
  const add = (map, id, v) => { let a = map.get(id); if (!a) map.set(id, a = []); a.push(v); };
  const lines = (t) => { try { const v = api.GetLineIDsWithType(modelID, t); const o = []; for (let i = 0; i < v.size(); i++) o.push(v.get(i)); return o; } catch { return []; } };
  for (const id of lines(WebIFC.IFCRELDEFINESBYPROPERTIES)) {
    const l = api.GetLine(modelID, id, false);
    const def = refId(l.RelatingPropertyDefinition);
    for (const o of toArr(l.RelatedObjects)) add(idx.psets, refId(o), def);
  }
  for (const id of lines(WebIFC.IFCRELDEFINESBYTYPE)) {
    const l = api.GetLine(modelID, id, false);
    const t = refId(l.RelatingType);
    for (const o of toArr(l.RelatedObjects)) idx.type.set(refId(o), t);
  }
  for (const id of lines(WebIFC.IFCRELCONTAINEDINSPATIALSTRUCTURE)) {
    const l = api.GetLine(modelID, id, false);
    const s = refId(l.RelatingStructure);
    for (const o of toArr(l.RelatedElements)) idx.storey.set(refId(o), s);
  }
  idx.parent = new Map();
  for (const id of lines(WebIFC.IFCRELAGGREGATES)) {
    const l = api.GetLine(modelID, id, false), p = refId(l.RelatingObject);
    for (const o of toArr(l.RelatedObjects)) idx.parent.set(refId(o), p);
  }
  try { buildLevels(api, WebIFC, modelID, idx, lines); } catch (e) { console.warn('อ่าน Level ไม่ได้', e); idx.levels = new Map(); idx.shift0 = 0; }
  return idx;
}

// ---------- Level (IfcBuildingStorey) -> ระดับจริง ----------
const SI_PREFIX = { EXA: 1e18, PETA: 1e15, TERA: 1e12, GIGA: 1e9, MEGA: 1e6, KILO: 1e3, HECTO: 1e2, DECA: 10, DECI: .1, CENTI: .01, MILLI: .001, MICRO: 1e-6, NANO: 1e-9 };
function buildLevels(api, WebIFC, modelID, idx, lines) {
  const L = (i, flat) => { try { return api.GetLine(modelID, i, !!flat); } catch { return null; } };
  // หน่วยความยาวของโปรเจกต์ -> เมตร
  let scale = 1;
  const siScale = u => { const p = u && u.Prefix ? ifcVal(u.Prefix) : ''; return SI_PREFIX[p] || 1; };
  let found = false;
  for (const id of lines(WebIFC.IFCCONVERSIONBASEDUNIT)) {
    const l = L(id, true); if (!l || ifcVal(l.UnitType) !== 'LENGTHUNIT') continue;
    const cf = l.ConversionFactor, v = cf && cf.ValueComponent && refId(cf.ValueComponent);
    if (typeof v === 'number') { scale = v * siScale(cf.UnitComponent); found = true; break; }
  }
  if (!found) for (const id of lines(WebIFC.IFCSIUNIT)) {
    const l = L(id); if (l && ifcVal(l.UnitType) === 'LENGTHUNIT') { scale = siScale(l); break; }
  }
  // ความสูง (Z) ของ placement สะสมตามลำดับชั้น
  const pz = (ref, d = 0) => {

function getIfcInfo(api, modelID, id, idx) {

  const add = (k, v) => { v = ifcVal(v); if (v !== '') info.rows.push([k, v]); };

  const t = idx.type.get(id);

  add('GlobalId', el.GlobalId);

  }

      if (!byKey.has(r.key)) byKey.set(r.key, []); byKey.get(r.key).push(r);

  hidden.set(k, cur);
  selToken++; clearHighlight(); hideInfo(); cur = null;
  applyHidden();
}
$('b-hide').onclick = hideCurrent;
$('b-unhide').onclick = () => { const on = !isOn('b-unhide'); setPressed('b-unhide', on); renderHid(); $('hid').hidden = !on; };
$('b-unhall').onclick = unhideAll;
addEventListener('keydown', e => {
  if (/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName) || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'H') unhideAll(); else if (e.key === 'h') hideCurrent();
});

async function selectHit(hit) {
  const token = ++selToken;
  clearHighlight(); cur = null;
  if (!hit) { hideInfo(); return; }
  const o = hit.object;
  if (ifc && o.userData.ifcMesh) {
    const id = o.geometry.attributes.expressId.getX(hit.face.a);
    highlightIfc(id);
    cur = {kind: 'ifc', id, name: ''};
    if (!ifc.index) {
      showInfo({title: 'กำลังอ่านข้อมูล…', rows: []});
      await new Promise(r => setTimeout(r, 30));
      if (token !== selToken) return;
      ifc.index = buildIfcIndex(ifc.api, ifc.WebIFC, ifc.modelID);
    }
    const i = getIfcInfo(ifc.api, ifc.modelID, id, ifc.index);
    if (token !== selToken) return;
    const bd = ifcBounds(ifc, id), lv = levelOf(ifc.index, id);
    let zTop, zBot;
    if (bd) {
      const sh = lv ? lv.shift : (ifc.index.shift0 || 0);
      zTop = bd.top + sh; zBot = bd.bot + sh;
    }
    if (i && bd) {
      const at = Math.max(1, i.rows.findIndex(r => r[0] === 'ชื่อ') + 1);
      const add = [];
      if (lv) add.push(['Level อ้างอิง', (lv.name || '-') + ' (' + fmtZ(lv.elev) + ' ม.)']);
      else add.push(['Level อ้างอิง', 'ไม่พบ Level ของชิ้นงานนี้ (ใช้ค่าชดเชยรวม ' + fmtZ(ifc.index.shift0 || 0) + ')']);
      add.push(['ระดับ TOP (ม.)', fmtZ(zTop)], ['ระดับ BOTTOM (ม.)', fmtZ(zBot)]);
      if (lv) add.push(['TOP เทียบ Level (ม.)', fmtZ(zTop - lv.elev)], ['BOTTOM เทียบ Level (ม.)', fmtZ(zBot - lv.elev)]);
      add.push(['ความสูง/หนา (ม.)', (zTop - zBot).toFixed(3)]);
      i.rows.splice(at, 0, ...add);
    }
    showInfo(i ? {title: i.name || i.cls, badge: i.cls, rows: i.rows, groups: i.groups} : {title: 'Express ID ' + id, rows: []});
    if (cur && cur.id === id) cur.name = (i && (i.name || i.cls)) || ('Express ID ' + id);
    if (i) { sel = Object.assign({root: ifc.root}, bd || {cx: 0, cy: 0, top: 0}); buildTag({name: i.name || i.cls, desc: i.desc, top: bd && zTop, bot: bd && zBot, level: lv ? (lv.name || '-') + ' (' + fmtZ(lv.elev) + ')' : ''}); if (!bd) sel = null; }
  } else {
    addOverlay(o, o.geometry);
    cur = {kind: 'obj', obj: o, name: o.name || (o.parent && o.parent.name) || 'Object'};
    showInfo(genericInfo(o));
  }
}

// คลิก (ไม่ลาก) = เลือกชิ้นส่วน
let down = null;
canvas.addEventListener('pointerdown', e => { down = e.button === 0 ? {x: e.clientX, y: e.clientY} : null; });
canvas.addEventListener('pointerup', e => {
  const d = down; down = null;
  if (!d || Math.hypot(e.clientX - d.x, e.clientY - d.y) > 5) return;
  setNDC(e); selectHit(firstHit());
});
addEventListener('keydown', e => { if (e.key === 'Escape') { selToken++; clearHighlight(); hideInfo(); } });

// ---------- Section Box ----------
const AX = ['x', 'y', 'z'];
const sec = {on: false, box: new THREE.Box3(), planes: [0, 1, 2, 3, 4, 5].map(() => new THREE.Plane()), handles: [], drag: null};
const secGroup = new THREE.Group(); secGroup.visible = false; scene.add(secGroup);
const secHelper = new THREE.Box3Helper(sec.box, 0x1f6feb);
secHelper.material.depthTest = false; secHelper.renderOrder = 998; secGroup.add(secHelper);
{
  const geo = new THREE.SphereGeometry(1, 20, 14);
  for (let i = 0; i < 6; i++) {
    const h = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({color: 0x1f6feb, depthTest: false, transparent: true, opacity: .95}));
    h.renderOrder = 999; h.userData = {axis: AX[i >> 1], sign: i & 1 ? -1 : 1};
    sec.handles.push(h); secGroup.add(h);
  }
}
function updateSection() {
  const b = sec.box, P = sec.planes;
  P[0].set(new THREE.Vector3(-1, 0, 0), b.max.x); P[1].set(new THREE.Vector3(1, 0, 0), -b.min.x);
  P[2].set(new THREE.Vector3(0, -1, 0), b.max.y); P[3].set(new THREE.Vector3(0, 1, 0), -b.min.y);
  P[4].set(new THREE.Vector3(0, 0, -1), b.max.z); P[5].set(new THREE.Vector3(0, 0, 1), -b.min.z);
  const c = b.getCenter(new THREE.Vector3());
  for (const h of sec.handles) { h.position.copy(c); h.position[h.userData.axis] = h.userData.sign > 0 ? b.max[h.userData.axis] : b.min[h.userData.axis]; }
}
function applyClipping() {
  const planes = sec.on ? sec.planes : null;
  const set = m => { m.clippingPlanes = planes; m.needsUpdate = true; };
  if (model) model.traverse(o => { if (o.isMesh) matsOf(o).forEach(set); });
  set(hlMat);
}
function setSection(on) {
  if (on && !model) return;
  sec.on = on; secGroup.visible = on; setPressed('b-sec', on);
  if (on) { sec.box.copy(box).expandByScalar(size * 0.002); updateSection(); }
  applyClipping();
}
function scaleHandles() {
  const k = 9 / innerHeight; // รัศมีจุดจับ ~9px
  for (const h of sec.handles) {
    const world = camera === persp ? persp.position.distanceTo(h.position) * 2 * halfTan : 2 * orthoHalf / ortho.zoom;
    h.scale.setScalar(world * k);
  }
}
function axisT(p1, axis, ray) {
  const d1 = new THREE.Vector3(); d1[axis] = 1;
  const d2 = ray.direction, w = p1.clone().sub(ray.origin);
  const b = d1.dot(d2), d = d1.dot(w), e = d2.dot(w), den = 1 - b * b;
  return den < 1e-6 ? null : (b * e - d) / den;
}
function hitHandle(e) {
  setNDC(e); raycaster.setFromCamera(ndc, camera);
  return raycaster.intersectObjects(sec.handles, false)[0] || null;
}
addEventListener('pointerdown', e => {
  if (!sec.on || e.target !== canvas || e.button !== 0 || e.ctrlKey || e.shiftKey || e.metaKey) return;
  const hit = hitHandle(e); if (!hit) return;
  e.stopPropagation(); e.preventDefault();
  const h = hit.object, {axis, sign} = h.userData, p1 = h.position.clone();
  sec.drag = {h, axis, sign, p1, t0: axisT(p1, axis, raycaster.ray), v0: sec.box[sign > 0 ? 'max' : 'min'][axis]};
  canvas.style.cursor = 'grabbing';
}, true);
addEventListener('pointermove', e => {
  const d = sec.drag;
  if (!d) { if (sec.on && e.target === canvas && e.buttons === 0) canvas.style.cursor = hitHandle(e) ? 'pointer' : ''; return; }
  setNDC(e); raycaster.setFromCamera(ndc, camera);
  const t = axisT(d.p1, d.axis, raycaster.ray); if (t === null || d.t0 === null) return;
  const gap = size * 0.002, b = sec.box;
  let v = d.v0 + (t - d.t0);
  v = d.sign > 0 ? Math.max(v, b.min[d.axis] + gap) : Math.min(v, b.max[d.axis] - gap);
  b[d.sign > 0 ? 'max' : 'min'][d.axis] = v;
  updateSection();
});
addEventListener('pointerup', () => { if (sec.drag) { sec.drag = null; canvas.style.cursor = ''; } });

// ---------- โหลดโมเดล ----------
const draco = new DRACOLoader().setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
const gltfLoader = new GLTFLoader().setDRACOLoader(draco).setMeshoptDecoder(MeshoptDecoder);

function disposeCurrent() {
  selToken++; clearHighlight(); hideInfo(); setSection(false);
  if (model) {
    scene.remove(model);
    model.traverse(o => { if (o.isMesh) { o.geometry.dispose(); matsOf(o).forEach(m => m.dispose()); } });
  }
  ovCache.forEach(gs => gs.forEach(g => g.dispose())); ovCache = new Map();
  if (ifc) { try { ifc.api.CloseModel(ifc.modelID); } catch {} }
  model = null; ifc = null; hidden.clear(); cur = null; $('hid-cnt').style.display = 'none'; $('hid').hidden = true; setPressed('b-unhide', false);
}

function show(obj, name, opts = {}) {
  disposeCurrent();
  model = obj; ifc = opts.ifc || null;
  setPressed('b-wire', false); setPressed('b-axis', false); zup = false;
  model.traverse(o => { if (o.isMesh) matsOf(o).forEach(m => { m.side = THREE.DoubleSide; }); });
  scene.add(model);
  if (opts.zup) { zup = true; model.rotation.x = -Math.PI / 2; setPressed('b-axis', true); }
  model.updateMatrixWorld(true);
  box.setFromObject(model);
  if (box.isEmpty()) { msg('ไม่พบรูปทรง 3 มิติในไฟล์', name); return; }
  size = box.getSize(new THREE.Vector3()).length() || 1;
  hideMsg(); document.title = name + ' – 3D Viewer';
  fit();
}

const ext = n => (n.split('?')[0].split('.').pop() || '').toLowerCase();
const fail = (name, err) => { $('bar-progress').style.width = '0'; if (err) console.error(err);
  msg('เปิดโมเดลไม่ได้', 'ไฟล์ ' + name + (err ? ' — สาเหตุ: ' + (err.message || err) : '') + ' | ตรวจสอบว่าไฟล์อยู่ในโฟลเดอร์ models, ชื่อถูกต้อง, และ push ขึ้น GitHub ครบ (ไฟล์ >100MB อัปโหลดตรง ๆ ไม่ได้)'); };
const prog = (got, total) => { if (total) $('bar-progress').style.width = Math.min(100, got / total * 100) + '%'; };
const done = (o, name) => { $('bar-progress').style.width = '0'; show(o, name); };

async function fetchOne(url) {
  const r = await fetch(url); if (!r.ok) throw new Error('HTTP ' + r.status + ' ' + url);
  const total = +r.headers.get('content-length') || 0;
  if (!r.body || !total) return r.arrayBuffer();
  const rd = r.body.getReader(), chunks = []; let got = 0;
  for (;;) { const {done, value} = await rd.read(); if (done) break; chunks.push(value); got += value.length; prog(got, total); }
  const out = new Uint8Array(got); let p = 0; for (const c of chunks) { out.set(c, p); p += c.length; }
  return out.buffer;
}
// ลองหลาย URL: ชื่อปกติ, Unicode NFC/NFD (ชื่อภาษาไทย/สระซ้อนอาจต่างกัน), และลิงก์ดาวน์โหลดจาก GitHub
async function fetchBuf(url) {
  const parts = url.split('/'), file = decodeURIComponent(parts.pop()), dir = parts.join('/');
  const c = [url];
  for (const f of ['NFC', 'NFD']) c.push(dir + '/' + encodeURIComponent(file.normalize(f)));
  const gh = guessRepo();
  if (gh) {
    const b = gh.branch || 'main';
    if (dlMap[file]) c.push(dlMap[file]);
    c.push(`https://cdn.jsdelivr.net/gh/${gh.owner}/${gh.repo}@${b}/${gh.folder}/${encodeURIComponent(file)}`);
    c.push(`https://raw.githubusercontent.com/${gh.owner}/${gh.repo}/${b}/${gh.folder}/${encodeURIComponent(file)}`);
  }
  let last;
  for (const u of [...new Set(c)]) {
    try { const buf = await fetchOne(u); if (buf.byteLength > 0) return buf; } catch (e) { last = e; console.warn('โหลดไม่ได้', u, e); }
  }
  throw last || new Error('ไม่พบไฟล์');
}

let ifcApiP = null;
function getIfcApi() {
  if (!ifcApiP) ifcApiP = (async () => {
    const WebIFC = await import(WEBIFC_BASE + 'web-ifc-api.js');
    const api = new WebIFC.IfcAPI(); api.SetWasmPath(WEBIFC_BASE, true); await api.Init();
    return {api, WebIFC};
  })().catch(e => { ifcApiP = null; throw e; });
  return ifcApiP;
}
async function loadIfcBuffer(buf, name) {
  msg('กำลังอ่านไฟล์ IFC…', 'ไฟล์ใหญ่อาจใช้เวลาสักครู่ และหน้าเว็บอาจค้างชั่วคราว');
  try {
    const {api, WebIFC} = await getIfcApi();
    await new Promise(r => setTimeout(r, 60));
    const r = await parseIfc(THREE, api, WebIFC, new Uint8Array(buf));
    $('bar-progress').style.width = '0';
    show(r.root, name, {zup: true, ifc: {api, WebIFC, modelID: r.modelID, ranges: r.ranges, meshes: r.meshes, root: r.root, index: null}});
  } catch (e) {
    console.error(e); $('bar-progress').style.width = '0';
    msg('อ่านไฟล์ IFC ไม่ได้', String(e && e.message || e) + ' (เปิดด้วย F12 > Console เพื่อดูรายละเอียด)');
  }
}

function loadUrl(url) {
  const name = decodeURIComponent(url.split('/').pop().split('?')[0]);
  const e = ext(url);
  if (e === 'ifc') { fetchBuf(url).then(b => loadIfcBuffer(b, name), e => fail(name, e)); return; }
  const onP = ev => prog(ev.loaded, ev.total);
  if (e === 'fbx') new FBXLoader().load(url, o => done(o, name), onP, () => fail(name));
  else if (e === 'obj') {
    const mtlUrl = url.replace(/\.obj(\?.*)?$/i, '.mtl');
    const base = mtlUrl.substring(0, mtlUrl.lastIndexOf('/') + 1);
    const go = mats => { const l = new OBJLoader(); if (mats) l.setMaterials(mats); l.load(url, o => done(o, name), onP, () => fail(name)); };
    new MTLLoader().setResourcePath(base).load(mtlUrl, mats => { mats.preload(); go(mats); }, undefined, () => go(null));
  } else gltfLoader.load(url, g => done(g.scene, name), onP, () => fail(name));
}
function loadFile(f) {
  const e = ext(f.name);
  if (!['glb', 'gltf', 'fbx', 'obj', 'ifc'].includes(e)) { alert('รองรับ .ifc .fbx .obj .glb .gltf'); return; }
  if (e === 'ifc') { f.arrayBuffer().then(b => loadIfcBuffer(b, f.name)); return; }
  const url = URL.createObjectURL(f), fin = o => { show(o, f.name); URL.revokeObjectURL(url); };
  if (e === 'fbx') new FBXLoader().load(url, fin);
  else if (e === 'obj') new OBJLoader().load(url, fin);
  else gltfLoader.load(url, g => fin(g.scene));
}

// ---------- รายการโครงการ ----------
// ถ้า repo ไม่ได้อยู่บน github.io (เช่น โดเมนของตัวเอง) ให้กรอก owner/repo ตรงนี้
const CFG = {owner: '', repo: '', branch: '', folder: 'models'};
const dlMap = {};
const MODEL_EXT = /\.(ifc|glb|gltf|fbx|obj)$/i;
function guessRepo() {
  if (CFG.owner && CFG.repo) return CFG;
  const h = location.hostname;
  if (h.endsWith('.github.io')) return {...CFG, owner: h.split('.')[0], repo: location.pathname.split('/')[1] || h};
  return null;
}
async function listModels() {
  let names = null;
  const gh = guessRepo();
  if (gh) {
    try {
      const r = await fetch(`https://api.github.com/repos/${gh.owner}/${gh.repo}/contents/${gh.folder}` + (gh.branch ? `?ref=${gh.branch}` : ''));
      if (r.ok) { const j = (await r.json()).filter(f => f.type === 'file' && MODEL_EXT.test(f.name)); j.forEach(f => dlMap[f.name] = f.download_url); names = j.map(f => f.name); }
    } catch {}
  }
  if (!names) { // สำรอง: models/index.json  ["a.ifc","b.fbx"]
    try { names = (await (await fetch(`${CFG.folder}/index.json`, {cache: 'no-cache'})).json()).filter(n => MODEL_EXT.test(n)); }
    catch { names = []; }
  }
  return names.sort((a, b) => a.localeCompare(b, 'th', {numeric: true, sensitivity: 'base'}));
}
const pathOf = n => `${CFG.folder}/${encodeURIComponent(n)}`;
function chooseModel(name) {
  const u = new URL(location.href); u.searchParams.set('model', pathOf(name));
  history.replaceState(null, '', u);
  msg('กำลังโหลดโมเดล…'); loadUrl(pathOf(name));
}
const m = params.get('model');
(async () => {
  const pick = $('pick'), names = await listModels();
  pick.innerHTML = '';
  if (!names.length) { pick.innerHTML = '<option>- ยังไม่มีโครงการ -</option>'; pick.disabled = true; return; }
  const base = n => n.replace(MODEL_EXT, '');
  const dup = new Set(names.map(base).filter((b, i, a) => a.indexOf(b) !== i));
  const cur = m ? decodeURIComponent(m.split('/').pop()) : '';
  if (!names.includes(cur)) { pick.add(new Option('เลือกโครงการ…', '', true, true)); pick.options[0].disabled = true; }
  names.forEach(n => pick.add(new Option(dup.has(base(n)) ? n : base(n), n, false, n === cur)));
  pick.onchange = () => chooseModel(pick.value);
})();
if (m) { msg('กำลังโหลดโมเดล…'); loadUrl(m); }

// ---------- ปุ่ม ----------
$('b-home').onclick = () => model && fit();
$('b-ortho').onclick = () => { const on = !isOn('b-ortho'); setPressed('b-ortho', on); if (model) setOrtho(on); else camera = on ? ortho : persp, controls.object = camera; };
$('b-axis').onclick = () => {
  if (!model) return;
  zup = !zup; setPressed('b-axis', zup);
  model.rotation.x = zup ? -Math.PI / 2 : 0; model.updateMatrixWorld(true);
  box.setFromObject(model); size = box.getSize(new THREE.Vector3()).length() || 1; fit();
  if (sec.on) setSection(true);
};
$('b-sec').onclick = () => setSection(!sec.on);
$('b-tag').onclick = () => { setPressed('b-tag', !isOn('b-tag')); updateTag(); };
$('b-wire').onclick = () => {
  const on = !isOn('b-wire'); setPressed('b-wire', on);
  model && model.traverse(o => o.isMesh && matsOf(o).forEach(mm => mm.wireframe = on));
};
$('b-link').onclick = async e => {
  const b = e.currentTarget;
  try { await navigator.clipboard.writeText(location.href); b.dataset.tip = 'คัดลอกลิงก์แล้ว'; }
  catch { prompt('คัดลอกลิงก์นี้', location.href); }
  setTimeout(() => b.dataset.tip = 'คัดลอกลิงก์แชร์', 1600);
};
addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('dragging'); });
addEventListener('dragleave', e => { if (!e.relatedTarget) document.body.classList.remove('dragging'); });
addEventListener('drop', e => { e.preventDefault(); document.body.classList.remove('dragging'); e.dataTransfer.files[0] && loadFile(e.dataTransfer.files[0]); });

resize();
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), .05);
  if (model) stepZoom(dt);
  stepSnap();
  controls.update();
  updateNearFar();
  if (sec.on) scaleHandles();
  updateTag();
  drawGizmo();
  renderer.render(scene, camera);
});
