<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Model Viewer</title>
<style>
  :root{--bg1:#e9edf2;--bg2:#b9c3d0;--ink:#1d2733;--panel:rgba(255,255,255,.88);--accent:#1f6feb}
  @media (prefers-color-scheme:dark){:root{--bg1:#2a3340;--bg2:#12171e;--ink:#e8edf3;--panel:rgba(28,34,42,.88);--accent:#6ea8ff}}
  html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,"Noto Sans Thai",sans-serif;color:var(--ink);
    background:linear-gradient(180deg,var(--bg1),var(--bg2))}
  canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
  .bar{position:fixed;left:12px;top:10px;display:flex;flex-direction:column;gap:4px;padding:5px;
    background:var(--panel);border-radius:12px;backdrop-filter:blur(8px);box-shadow:0 2px 12px rgba(0,0,0,.18)}
  .tool{position:relative;width:38px;height:38px;border:0;background:transparent;color:inherit;border-radius:8px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;padding:0}
  .tool svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .tool:hover,.tool[aria-pressed=true]{background:rgba(127,127,127,.22)}
  .tool[aria-pressed=true]{color:var(--accent)}
  .tool:focus-visible{outline:2px solid var(--accent)}
  .tool::after{content:attr(data-tip);position:absolute;left:calc(100% + 12px);top:50%;transform:translateY(-50%);white-space:nowrap;
    font-size:13px;padding:6px 10px;border-radius:7px;background:var(--ink);color:var(--bg1);opacity:0;pointer-events:none;transition:opacity .12s}
  .tool:hover::after,.tool:focus-visible::after{opacity:1}
  #msg{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;pointer-events:none}
  #msg b{font-size:20px} #msg span{opacity:.7;font-size:14px;max-width:420px;line-height:1.5}
  #drop{position:fixed;inset:12px;border:2px dashed var(--accent);border-radius:16px;display:none;align-items:center;justify-content:center;font-size:18px;background:rgba(31,111,235,.08)}
  body.dragging #drop{display:flex}
  #bar-progress{position:fixed;top:0;left:0;height:3px;width:0;background:var(--accent);transition:width .15s}
  #pick{position:fixed;top:10px;right:12px;max-width:min(56vw,340px);min-width:180px;font:inherit;font-size:14px;color:var(--ink);
    background:var(--panel);border:0;border-radius:10px;padding:9px 12px;backdrop-filter:blur(8px);box-shadow:0 2px 12px rgba(0,0,0,.18);cursor:pointer}
  #pick:focus-visible{outline:2px solid var(--accent)}
  #pick:disabled{cursor:default;opacity:.75}
  body.ui0 .bar,body.ui0 #pick{display:none}
</style>
</head>
<body>
<div id="bar-progress"></div>
<select id="pick" aria-label="เลือกโครงการ"><option>กำลังโหลดรายการ…</option></select>
<div id="msg"><b>เลือกโครงการจากเมนูมุมขวาบน</b><span>โมเดลอ่านจากโฟลเดอร์ models ใน GitHub</span></div>
<div id="drop">วางไฟล์เพื่อดูตัวอย่าง</div>
<div class="bar" id="bar">
  <button class="tool" id="b-home" data-tip="รีเซ็ตมุมมอง" aria-label="รีเซ็ตมุมมอง"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/><circle cx="12" cy="12" r="2.5"/></svg></button>
  <button class="tool" id="b-ortho" data-tip="มุมมองแบบ Orthographic (ไม่มีมุมมองลึก)" aria-label="มุมมองแบบ Orthographic (ไม่มีมุมมองลึก)" aria-pressed="false"><svg viewBox="0 0 24 24"><rect x="4" y="8" width="12" height="12"/><path d="M4 8l4-4h12v12l-4 4M16 8l4-4"/></svg></button>
  <button class="tool" id="b-axis" data-tip="สลับแกน Z/Y (ถ้าโมเดลนอนตะแคง)" aria-label="สลับแกน Z/Y (ถ้าโมเดลนอนตะแคง)" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7M21 4v5h-5"/></svg></button>
  <button class="tool" id="b-wire" data-tip="โหมดเส้นลวด (Wireframe)" aria-label="โหมดเส้นลวด (Wireframe)" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9zM12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg></button>
  <button class="tool" id="b-link" data-tip="คัดลอกลิงก์แชร์" aria-label="คัดลอกลิงก์แชร์"><svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg></button>
</div>
<script type="importmap">
{"imports":{
 "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
 "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {DRACOLoader} from 'three/addons/loaders/DRACOLoader.js';
import {MeshoptDecoder} from 'three/addons/libs/meshopt_decoder.module.js';
import {FBXLoader} from 'three/addons/loaders/FBXLoader.js';
import {OBJLoader} from 'three/addons/loaders/OBJLoader.js';
import {MTLLoader} from 'three/addons/loaders/MTLLoader.js';

const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
if (params.get('ui') === '0') document.body.classList.add('ui0');

// ---------- scene ----------
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xffffff, 0x778899, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(5,10,7); scene.add(sun);
const fill = new THREE.DirectionalLight(0xffffff, .5); fill.position.set(-6,3,-5); scene.add(fill);

const persp = new THREE.PerspectiveCamera(45, 1, .01, 100000);
const ortho = new THREE.OrthographicCamera(-1,1,1,-1,-100000,100000);
let camera = persp;
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.screenSpacePanning = true;

let zup = false, model = null, box = new THREE.Box3(), size = 1, home = null;

function resize(){
  const w = innerWidth, h = innerHeight; renderer.setSize(w,h);
  persp.aspect = w/h; persp.updateProjectionMatrix();
  const a = w/h, s = size*.7; ortho.left=-s*a; ortho.right=s*a; ortho.top=s; ortho.bottom=-s; ortho.updateProjectionMatrix();
}
addEventListener('resize', resize);

function fit(){
  const c = box.getCenter(new THREE.Vector3());
  const d = size*1.6;
  persp.near = size/1000; persp.far = size*100; persp.updateProjectionMatrix();
  persp.position.copy(c).add(new THREE.Vector3(d*.8, d*.55, d*.8));
  ortho.position.copy(persp.position);
  controls.target.copy(c);
  controls.maxDistance = size*20;
  camera.lookAt(c); controls.update(); resize();
}

// ---------- loading ----------
const draco = new DRACOLoader().setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
const loader = new GLTFLoader().setDRACOLoader(draco).setMeshoptDecoder(MeshoptDecoder);

function show(obj, name){
  if (model) { scene.remove(model); }
  model = obj;
  zup = false;
  model.traverse(o => { if (o.isMesh) {
    (Array.isArray(o.material)?o.material:[o.material]).forEach(m => { m.side = THREE.DoubleSide; });
  }});
  const bb = new THREE.Box3().setFromObject(model);
  if (!isFinite(bb.min.x)) { $('msg').innerHTML = '<b>ไม่พบเรขาคณิตในไฟล์</b>'; return; }
  scene.add(model);
  box.setFromObject(model);
  size = box.getSize(new THREE.Vector3()).length() || 1;
  $('msg').style.display = 'none';
  document.title = name + ' – 3D Viewer';
  fit();
}

const ext = n => (n.split('?')[0].split('.').pop() || '').toLowerCase();
const fail = name => { $('bar-progress').style.width = '0';
  $('msg').style.display = 'flex';
  $('msg').innerHTML = '<b>เปิดโมเดลไม่ได้</b><span>ตรวจสอบว่าไฟล์ ' + name.replace(/</g,'') + ' อยู่ในโฟลเดอร์ models และพิมพ์ชื่อถูกต้อง (ตัวพิมพ์เล็ก/ใหญ่มีผล)</span>'; };
const prog = e => { if (e.total) $('bar-progress').style.width = (e.loaded/e.total*100)+'%'; };
const done = (o, name) => { $('bar-progress').style.width = '0'; show(o, name); };

function loadUrl(url){
  const name = decodeURIComponent(url.split('/').pop().split('?')[0]);
  const e = ext(url);
  if (e === 'fbx') new FBXLoader().load(url, o => done(o, name), prog, () => fail(name));
  else if (e === 'obj') {
    const mtlUrl = url.replace(/\.obj(\?.*)?$/i, '.mtl');
    const base = mtlUrl.substring(0, mtlUrl.lastIndexOf('/') + 1);
    const go = mats => { const l = new OBJLoader(); if (mats) l.setMaterials(mats);
      l.load(url, o => done(o, name), prog, () => fail(name)); };
    new MTLLoader().setResourcePath(base).load(mtlUrl, mats => { mats.preload(); go(mats); }, undefined, () => go(null));
  } else loader.load(url, g => done(g.scene, name), prog, () => fail(name));
}

function loadFile(f){
  const e = ext(f.name);
  if (!['glb','gltf','fbx','obj'].includes(e)) { alert('รองรับ .glb .gltf .fbx .obj'); return; }
  const url = URL.createObjectURL(f);
  const fin = o => { show(o, f.name); URL.revokeObjectURL(url); };
  if (e === 'fbx') new FBXLoader().load(url, fin);
  else if (e === 'obj') new OBJLoader().load(url, fin);
  else loader.load(url, g => fin(g.scene));
}

// ---------- project list ----------
// ถ้า repo ไม่ได้อยู่บน github.io (เช่น โดเมนของตัวเอง) ให้กรอก owner/repo ตรงนี้
const CFG = {owner:'', repo:'', branch:'', folder:'models'};
const MODEL_EXT = /\.(glb|gltf|fbx|obj)$/i;

function guessRepo(){
  if (CFG.owner && CFG.repo) return CFG;
  const h = location.hostname;
  if (h.endsWith('.github.io')) return {...CFG, owner:h.split('.')[0], repo:location.pathname.split('/')[1] || h};
  return null;
}
async function listModels(){
  let names = null;
  const gh = guessRepo();
  if (gh) { // อ่านรายชื่อไฟล์ในโฟลเดอร์ models จาก GitHub โดยตรง (อัพไฟล์เพิ่มแล้วรายการอัปเดตเอง)
    try {
      const r = await fetch(`https://api.github.com/repos/${gh.owner}/${gh.repo}/contents/${gh.folder}` + (gh.branch ? `?ref=${gh.branch}` : ''));
      if (r.ok) names = (await r.json()).filter(f => f.type === 'file' && MODEL_EXT.test(f.name)).map(f => f.name);
    } catch {}
  }
  if (!names) { // สำรอง: models/index.json  ["a.glb","b.fbx"]
    try { names = (await (await fetch(`${CFG.folder}/index.json`, {cache:'no-cache'})).json()).filter(n => MODEL_EXT.test(n)); }
    catch { names = []; }
  }
  return names.sort((a, b) => a.localeCompare(b, 'th', {numeric:true, sensitivity:'base'}));
}
const pathOf = n => `${CFG.folder}/${encodeURIComponent(n)}`;
function select(name){
  const u = new URL(location.href); u.searchParams.set('model', pathOf(name));
  history.replaceState(null, '', u);
  $('msg').style.display = 'flex'; $('msg').innerHTML = '<b>กำลังโหลดโมเดล…</b>';
  loadUrl(pathOf(name));
}
(async () => {
  const pick = $('pick'), names = await listModels();
  pick.innerHTML = '';
  if (!names.length) {
    pick.innerHTML = '<option>- ยังไม่มีโครงการ -</option>'; pick.disabled = true; return;
  }
  const base = n => n.replace(MODEL_EXT, '');
  const dup = new Set(names.map(base).filter((b, i, a) => a.indexOf(b) !== i));
  const cur = m ? decodeURIComponent(m.split('/').pop()) : '';
  if (!names.includes(cur)) pick.add(new Option('เลือกโครงการ…', '', true, true)), pick.options[0].disabled = true;
  names.forEach(n => pick.add(new Option(dup.has(base(n)) ? n : base(n), n, false, n === cur)));
  pick.onchange = () => select(pick.value);
})();

const m = params.get('model');
if (m) { $('msg').innerHTML = '<b>กำลังโหลดโมเดล…</b>'; loadUrl(m); }

// ---------- UI ----------
$('b-home').onclick = () => model && fit();
$('b-ortho').onclick = e => {
  const on = e.currentTarget.getAttribute('aria-pressed') !== 'true';
  e.currentTarget.setAttribute('aria-pressed', on);
  const t = controls.target.clone(), p = camera.position.clone();
  camera = on ? ortho : persp;
  camera.position.copy(p); camera.zoom = 1;
  controls.object = camera; controls.target.copy(t); camera.lookAt(t); controls.update(); resize();
};
$('b-axis').onclick = e => {
  if (!model) return;
  zup = !zup; e.currentTarget.setAttribute('aria-pressed', zup);
  model.rotation.x = zup ? -Math.PI/2 : 0; model.updateMatrixWorld(true);
  box.setFromObject(model); size = box.getSize(new THREE.Vector3()).length() || 1; fit();
};
$('b-wire').onclick = e => {
  const on = e.currentTarget.getAttribute('aria-pressed') !== 'true';
  e.currentTarget.setAttribute('aria-pressed', on);
  model?.traverse(o => o.isMesh && (Array.isArray(o.material)?o.material:[o.material]).forEach(mm => mm.wireframe = on));
};
$('b-link').onclick = async e => {
  const b = e.currentTarget;
  try { await navigator.clipboard.writeText(location.href); b.dataset.tip = 'คัดลอกลิงก์แล้ว'; }
  catch { prompt('คัดลอกลิงก์นี้', location.href); }
  setTimeout(() => b.dataset.tip = 'คัดลอกลิงก์แชร์', 1600);
};
addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('dragging'); });
addEventListener('dragleave', e => { if (!e.relatedTarget) document.body.classList.remove('dragging'); });
addEventListener('drop', e => { e.preventDefault(); document.body.classList.remove('dragging');
  e.dataTransfer.files[0] && loadFile(e.dataTransfer.files[0]); });

resize();
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
</body>
</html>
